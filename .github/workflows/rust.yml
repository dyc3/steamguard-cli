name: Lint, Build, Test

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --verbose --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --no-deps --all-features --all-targets -- -D warnings
      - name: Validate documentation
        run: cargo doc --workspace --no-deps --all-features
      - name: Run tests
        run: cargo test --verbose --all-features --all-targets --workspace
  check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ matrix.target }}
      - name: Install Cross
        if: matrix.use-cross
        uses: baptiste0928/cargo-install@v2
        with:
          crate: cross
      - name: Check
        run: ${{ matrix.use-cross && 'cross' || 'cargo' }} check --verbose --all-targets --all-features --target ${{ matrix.target }}
